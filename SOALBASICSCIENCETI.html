<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Basic Science - UPKSAINTEK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #091529; 
            --card-bg: #1b263b;
            --accent: #4cc9f0;    
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- TOMBOL KEMBALI --- */
        .btn-back-corner {
            position: absolute;
            top: 30px;
            left: 30px;
            background: var(--card-bg);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
        }

        .btn-back-corner:hover {
            background: var(--accent);
            color: #0d1b2a;
            transform: translateX(-3px);
        }

        /* --- CONTENT AREA --- */
        .main-content {
            padding: 100px 20px 50px 20px;
            display: flex;
            justify-content: center;
        }

        .container-soal {
            width: 100%;
            max-width: 900px;
        }

        .header-soal {
            position: sticky;
            top: 20px;
            background: rgba(14, 23, 41, 0.9);
            backdrop-filter: blur(20px);
            padding: 25px 30px;
            border-radius: 25px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-progress-container {
            height: 8px;
            background: #333;
            border-radius: 10px;
            width: 180px;
            overflow: hidden;
            margin-top: 8px;
        }

        .custom-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1e07ee, #d900ff);
            width: 0%;
            transition: 0.6s ease;
        }

        .card-soal {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            transition: 0.4s;
        }

        .card-soal:hover {
            background: rgba(5, 189, 245, 0.1);
            border-color: var(--accent);
        }

        .nomor {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: #000;
            border-radius: 12px;
            font-weight: 700;
            margin-right: 15px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px;
            color: white;
            resize: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.4);
        }

        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track { background: transparent; margin: 10px; }
        textarea::-webkit-scrollbar-thumb { background: rgba(169, 76, 240, 0.732); border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .btn-kirim {
            background: linear-gradient(135deg, #5ff04c 0%, #4361ee 100%);
            color: white;
            border-radius: 18px;
            padding: 18px 50px;
            font-weight: 700;
            border: none;
            transition: 0.3s;
            text-transform: uppercase;
        }

        #finishOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 41, 63, 0.95);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        .finish-content {
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .finish-icon {
            font-size: 80px;
            color: #4cf057;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(76, 221, 240, 0.693));
        }

        .finish-text {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #5ff04c, #4361ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        html { zoom: 90%; scroll-behavior: smooth; }
    </style>
</head>
<body>

    <div id="finishOverlay">
        <div class="finish-content text-center">
            <div class="finish-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="finish-text">BERHASIL!</div>
            <p class="mt-3 opacity-75"> Oke, Jawabanmu telah tersimpan.</p>
            <a href="ISIMENULATIHANTI.html" class="btn btn-outline-info rounded-pill px-4 mt-3">Kembali ke Dashboard</a>
        </div>
    </div>


    <a href="ISIMENULATIHANTI.html" class="btn-back-corner">
        <i class="fa-solid fa-chevron-left"></i> Kembali ke Menu
    </a>

    <div class="main-content">
        <div class="container-soal">
            <div class="header-soal">
                <div>
                    <h3 class="fw-bold mb-1">
                        <i class="fa-solid fa-atom me-2" style="color: var(--accent);"></i>
                        Latihan Basic Science
                    </h3>
                    <p class="text-white-50 mb-0">Uji pengetahuan dasar Fisika, Kimia, dan Biologi.</p>
                </div>
                <div class="text-end">
                    <span id="progressText" class="fw-bold" style="color: var(--accent); font-size: 1.4rem;">0%</span>
                    <div class="custom-progress-container">
                        <div id="progressBar" class="custom-progress-bar"></div>
                    </div>
                </div>
            </div>

            <div id="soalContainer"></div>

            <div class="text-center mt-5 mb-5">
                <button class="btn-kirim" onclick="kirimJawaban()">
                    <i class="fa-solid fa-cloud-arrow-up me-2"></i> Kumpulkan Jawaban
                </button>
            </div>
        </div>
    </div>

    <script>
        // DAFTAR SOAL BASIC SCIENCE
        const soalList = [
            "Apa yang dimaksud dengan Metode Ilmiah?",
            "Jelaskan hukum Newton I tentang gerak benda!",
            "Apa perbedaan antara perubahan fisika dan perubahan kimia? Berikan contohnya!",
            "Sebutkan tingkatan organisasi kehidupan dari yang terkecil hingga terbesar!",
            "Apa fungsi utama mitokondria di dalam sel makhluk hidup?",
            "Jelaskan apa yang dimaksud dengan Tabel Periodik Unsur!",
            "Apa perbedaan antara konduksi, konveksi, dan radiasi dalam perpindahan kalor?",
            "Bagaimana proses fotosintesis pada tumbuhan terjadi secara singkat?",
            "Apa yang dimaksud dengan ekosistem dan sebutkan komponen penyusunnya!",
            "Jelaskan perbedaan antara atom, molekul, dan ion!"
        ];

        const container = document.getElementById("soalContainer");
        
        soalList.forEach((soal, i) => {
            container.innerHTML += `
            <div class="card-soal">
                <div class="question-text mb-3">
                    <span class="nomor">${i+1}</span> <strong>${soal}</strong>
                </div>
                <textarea id="jawaban_${i}" placeholder="Tulis jawabanmu di sini..."></textarea>
            </div>
            `;
        });

        const textareas = document.querySelectorAll("textarea");

        function updateProgress() {
            let filled = 0;
            textareas.forEach(t => { if (t.value.trim() !== "") filled++; });
            let persen = Math.round((filled / textareas.length) * 100);
            document.getElementById("progressBar").style.width = persen + "%";
            document.getElementById("progressText").innerText = persen + "%";
        }

        textareas.forEach((el, i) => {
            el.value = localStorage.getItem("jawaban_science_"+i) || "";
            el.addEventListener("input", function () {
                localStorage.setItem("jawaban_science_"+i, this.value);
                updateProgress();
            });
        });

        updateProgress();

        function kirimJawaban(){
            let terisi = 0;
            textareas.forEach(t => { if (t.value.trim() !== "") terisi++; });
            
            if(terisi < soalList.length) {
                if(!confirm("Beberapa soal belum diisi. Tetap kumpulkan?")) return;
            }

            const overlay = document.getElementById('finishOverlay');
            overlay.style.display = 'flex';
            
            let skor = Math.round((terisi / textareas.length) * 100);
            localStorage.setItem("last_score_science", skor);
        }
    </script>
</body>
</html>
