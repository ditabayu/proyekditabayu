<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Statistika Terapan - UPKSAINTEK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0d1b2a;
            --sidebar-bg: rgba(27, 38, 59, 0.8);
            --card-bg: rgba(255, 255, 255, 0.04);
            --accent: #5a4cf0; /* Warna Biru Terang untuk Aksen */
            
            /* UBAH WARNA KOTAK SOAL DI SINI */
            --glass: rgba(13, 16, 45, 0.85); /* Warna dasar kotak (Gelap) */
            --glass-hover: rgba(76, 84, 240, 0.15); /* Warna saat kotak disentuh */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- TOMBOL KEMBALI --- */
        .btn-back-corner {
            position: absolute;
            top: 30px;
            left: 30px;
            background: var(--card-bg);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
        }

        .btn-back-corner:hover {
            background: var(--accent);
            color: #0f0415;
            transform: translateX(-3px);
        }

        /* --- CONTENT AREA --- */
        .main-content {
            padding: 100px 20px 50px 20px;
            display: flex;
            justify-content: center;
        }

        .container-soal {
            width: 100%;
            max-width: 900px;
        }

        .header-soal {
            position: sticky;
            top: 20px;
            background: rgba(15, 4, 21, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px 30px;
            border-radius: 25px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-progress-container {
            height: 8px;
            background: #222;
            border-radius: 10px;
            width: 180px;
            overflow: hidden;
            margin-top: 8px;
        }

        .custom-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #34c504);
            width: 0%;
            transition: 0.6s ease;
        }

        /* --- KOTAK LATIHAN (CARD) --- */
        .card-soal {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            transition: 0.4s ease;
        }

        .card-soal:hover {
            background: var(--glass-hover);
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .nomor {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: #0f0415;
            border-radius: 12px;
            font-weight: 700;
            margin-right: 15px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        /* --- TEXTAREA --- */
        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px;
            color: white;
            resize: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
        }

        .btn-kirim {
            background: linear-gradient(135deg, #5ff04c 0%, var(--accent) 100%);
            color: #0f0415;
            border-radius: 18px;
            padding: 18px 50px;
            font-weight: 700;
            border: none;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-kirim:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(95, 240, 76, 0.4);
        }

        /* --- OVERLAY SELESAI --- */
        #finishOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 9, 21, 0.98);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(15px);
        }

        .finish-icon {
            font-size: 80px;
            color: #5ff04c;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(95, 240, 76, 0.5));
        }

        .finish-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #5ff04c, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html { zoom: 90%; scroll-behavior: smooth; }
    </style>
</head>
<body>

    <div id="finishOverlay">
        <div class="finish-content text-center">
            <div class="finish-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="finish-text">BERHASIL!</div>
            <p class="mt-3 opacity-75"> Oke, Jawabanmu telah tersimpan.</p>
            <a href="ISILATIHANSOALPTI.html" class="btn btn-outline-info rounded-pill px-4 mt-3">Kembali ke Dashboard</a>
        </div>
    </div>

    <a href="ISILATIHANSOALPTI.html" class="btn-back-corner">
        <i class="fa-solid fa-chevron-left"></i> Kembali ke Menu
    </a>

    <div class="main-content">
        <div class="container-soal">
            <div class="header-soal">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fa-solid fa-chart-line me-2" style="color: var(--accent);"></i>Latihan Statistika Terapan</h3>
                    <p class="text-white-50 mb-0">Selesaikan semua soal untuk update statistik belajarmu.</p>
                </div>
                <div class="text-end">
                    <span id="progressText" class="fw-bold" style="color: var(--accent); font-size: 1.4rem;">0%</span>
                    <div class="custom-progress-container">
                        <div id="progressBar" class="custom-progress-bar"></div>
                    </div>
                </div>
            </div>

            <div id="soalContainer"></div>

            <div class="text-center mt-5 mb-5">
                <button class="btn-kirim" onclick="kirimJawaban()">
                    <i class="fa-solid fa-paper-plane me-2"></i> Kumpulkan Sekarang
                </button>
            </div>
        </div>
    </div>

    <script>
        const soalList = [
            "Jelaskan perbedaan antara statistika deskriptif dan statistika inferensial!",
            "Apa yang dimaksud dengan variabel independen dan variabel dependen dalam sebuah penelitian?",
            "Jelaskan konsep p-value dalam pengujian hipotesis dan bagaimana cara interpretasinya!",
            "Kapan kita harus menggunakan uji t-test dan kapan harus menggunakan uji ANOVA?",
            "Apa perbedaan antara korelasi dan regresi dalam analisis data?",
            "Jelaskan apa yang dimaksud dengan Standard Deviation (Simpangan Baku) dan kegunaannya!",
            "Bagaimana cara menentukan apakah sebuah distribusi data bersifat normal atau tidak?",
            "Sebutkan dan jelaskan jenis-jenis skala pengukuran data (Nominal, Ordinal, Interval, Rasio)!",
            "Apa yang dimaksud dengan Confidence Interval (Selang Kepercayaan)?",
            "Jelaskan konsep Error Tipe I dan Error Tipe II dalam pengambilan keputusan statistik!"
        ];

        const container = document.getElementById("soalContainer");
        soalList.forEach((soal, i) => {
            container.innerHTML += `
            <div class="card-soal">
                <div class="question-text">
                    <span class="nomor">${i+1}</span> ${soal}
                </div>
                <textarea id="jawaban_${i}" placeholder="Ketik jawabanmu secara detail di sini..."></textarea>
            </div>
            `;
        });

        const textareas = document.querySelectorAll("textarea");

        function updateProgress() {
            let filled = 0;
            textareas.forEach(t => { if (t.value.trim() !== "") filled++; });
            let persen = Math.round((filled / textareas.length) * 100);
            document.getElementById("progressBar").style.width = persen + "%";
            document.getElementById("progressText").innerText = persen + "%";
        }

        textareas.forEach((el, i) => {
            el.value = localStorage.getItem("jawaban_"+i) || "";
            el.addEventListener("input", function () {
                localStorage.setItem("jawaban_"+i, this.value);
                updateProgress();
            });
        });

        updateProgress();

            // Fungsi Tombol Kirim
            function kirimJawaban(){
            let terisi = 0;
            textareas.forEach(t => { if (t.value.trim() !== "") terisi++; });
            
            if(terisi < soalList.length) {
                if(!confirm("Beberapa soal belum diisi. Tetap kumpulkan?")) return;
            }

            const overlay = document.getElementById('finishOverlay');
            overlay.style.display = 'flex';
            
            // Simpan skor sederhana ke localStorage
            let skor = Math.round((terisi / textareas.length) * 100);
            localStorage.setItem("last_score_web", skor);
        }


    </script>
</body>
</html>
