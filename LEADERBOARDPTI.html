<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Premium - UPKSAINTEK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #080721; 
            --sidebar-bg: #100f3c;
            --card-bg: #181a3d;
            --accent: #4853ed;
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: rgb(255, 255, 255); margin: 0; overflow-x: hidden; }

         /* --- SIDEBAR KONSISTEN (Sama dengan Statistik) --- */
         .sidebar {
            background-color: var(--card-bg); 
            height: 90vh; padding: 25px 15px;
            border: 1px solid rgba(255, 255, 255, 0.05); position: fixed; 
            width: 260px; top: 5vh; left: 20px; border-radius: 30px;
            z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        .menu-link {
            display: flex; align-items: center; color: #adb5bd; text-decoration: none;
            padding: 12px 15px; border-radius: 15px; margin-bottom: 8px; transition: 0.3s;
        }

        .img-menu-icon { width: 20px; height: 20px; margin-right: 12px; object-fit: contain; }
        
        .menu-link.active { 
            background-color: var(--accent); 
            color: #0d1b2a !important; 
            font-weight: 600; 
        }
        
        .menu-link:hover:not(.active) { background: rgba(255,255,255,0.05); color: white; }

        .profile-section {
            margin-top: auto; padding: 15px; background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; display: flex; align-items: center;
        }

        /* --- MAIN CONTENT --- */
        .main-content { margin-left: 310px; padding: 40px; }
        .title-icon { width: 35px; height: 35px; margin-left: 8px; vertical-align: middle; filter: drop-shadow(0 0 5px var(--accent)); }

        /* --- PODIUM DENGAN GAMBAR MEDALI --- */
        .podium-container { 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            gap: 20px; 
            margin: 60px 0 80px 0; 
            min-height: 450px; 
        }

        .podium-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            flex: 1; 
            max-width: 200px; 
        }

        /* Styling Gambar Medali */
        .medal-graphic {
            width: 150px; 
            height: auto;
            margin-bottom: -10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
            z-index: 2;
            transition: 0.3s ease;
        }

        .podium-item:nth-child(2) .medal-graphic {
            width: 210px; /* Emas lebih besar */
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
        }

        .podium-item:hover .medal-graphic {
            transform: scale(1.1) translateY(-5px);
        }

        /* Nama & Poin di bawah Medali */
        .winner-name { font-weight: 700; margin-top: 10px; margin-bottom: 2px; }
        .winner-xp { font-size: 0.85rem; opacity: 0.7; margin-bottom: 15px; }

        /* Step Podium */
        .podium-step { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            font-weight: 800; 
            font-size: 2.5rem; 
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .step-1 { height: 200px; background: linear-gradient(180deg, #ffd700, #b8860b); color: #f30606; border: 2px solid var(--gold); }
        .step-2 { height: 150px; background: linear-gradient(180deg, #fffdfd, #757575); color: #f06306; border: 2px solid var(--silver); }
        .step-3 { height: 120px; background: linear-gradient(180deg, #f9af66, #8b4513); color: #e7f805; border: 2px solid var(--bronze); }

        /* --- LIST ROW --- */
        .dark-list-container { 
            background: rgba(27, 38, 59, 0.6); 
            border-radius: 30px; padding: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-row { 
            background: rgba(255, 255, 255, 0.03); border-radius: 18px; 
            padding: 18px 25px; margin-bottom: 12px; 
            display: flex; align-items: center; justify-content: space-between; 
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .list-row:hover { background: rgba(76, 201, 240, 0.1); transform: translateX(10px); }
        .xp-text { font-weight: 700; color: var(--gold); }
        .rank-num { font-weight: 800; color: var(--accent); width: 35px; }

        html { zoom: 90%; }
    </style>
</head>
<body>
    <div class="sidebar">

        <nav>

        </nav>

</body>
