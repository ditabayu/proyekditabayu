<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Premium - UPKSAINTEK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #080721; 
            --sidebar-bg: #100f3c;
            --card-bg: #181a3d;
            --accent: #4853ed;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-body); 
            color: rgb(255, 255, 255); 
            margin: 0; 
            overflow-x: hidden; 
        }

        /* --- SIDEBAR DESKTOP KONSISTEN --- */
        .sidebar {
            background-color: var(--card-bg); 
            height: 90vh; padding: 25px 15px;
            border: 1px solid rgba(255, 255, 255, 0.05); position: fixed; 
            width: 260px; top: 5vh; left: 20px; border-radius: 30px;
            z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; transition: all 0.3s ease;
        }

        .sidebar h4 { display: block; }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .menu-link {
            display: flex; align-items: center; color: #adb5bd; text-decoration: none;
            padding: 12px 15px; border-radius: 15px; margin-bottom: 8px; transition: 0.3s;
        }

        .img-menu-icon { width: 20px; height: 20px; margin-right: 12px; object-fit: contain; }
        
        .menu-link.active { 
            background-color: var(--accent); 
            color: white !important; 
            font-weight: 600; 
        }
        
        .menu-link:hover:not(.active) { background: rgba(255,255,255,0.05); color: white; }

        .profile-section {
            margin-top: auto; padding: 15px; background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; display: flex; align-items: center;
            overflow: hidden; width: 100%;
        }

        /* --- MAIN CONTENT --- */
        .main-content { margin-left: 310px; padding: 40px; transition: all 0.3s ease; }
        .title-icon { width: 35px; height: 35px; margin-left: 8px; vertical-align: middle; filter: drop-shadow(0 0 5px var(--accent)); }

        /* --- PODIUM DENGAN GAMBAR MEDALI --- */
        .podium-container { 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            gap: 20px; 
            margin: 60px 0 80px 0; 
            min-height: 450px; 
        }

        .podium-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            flex: 1; 
            max-width: 200px; 
        }

        /* Styling Gambar Medali */
        .medal-graphic {
            width: 100%;
            max-width: 150px; 
            height: auto;
            margin-bottom: -10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
            z-index: 2;
            transition: 0.3s ease;
        }

        .podium-item:nth-child(2) .medal-graphic {
            max-width: 210px; /* Emas lebih besar */
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
        }

        .podium-item:hover .medal-graphic {
            transform: scale(1.1) translateY(-5px);
        }

        /* Nama & Poin di bawah Medali */
        .winner-name { font-weight: 700; margin-top: 10px; margin-bottom: 2px; }
        .winner-xp { font-size: 0.85rem; opacity: 0.7; margin-bottom: 15px; }

        /* Step Podium */
        .podium-step { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            font-weight: 800; 
            font-size: 2.5rem; 
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .step-1 { height: 200px; background: linear-gradient(180deg, #ffd700, #b8860b); color: #f30606; }
        .step-2 { height: 150px; background: linear-gradient(180deg, #fffdfd, #757575); color: #f06306; }
        .step-3 { height: 120px; background: linear-gradient(180deg, #f9af66, #8b4513); color: #e7f805; }

        /* --- LIST ROW --- */
        .dark-list-container { 
            background: rgba(27, 38, 59, 0.6); 
            border-radius: 30px; padding: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-row { 
            background: rgba(255, 255, 255, 0.03); border-radius: 18px; 
            padding: 18px 25px; margin-bottom: 12px; 
            display: flex; align-items: center; justify-content: space-between; 
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .list-row:hover { background: rgba(76, 201, 240, 0.1); transform: translateX(10px); }
        .xp-text { font-weight: 700; color: var(--gold); }
        .rank-num { font-weight: 800; color: var(--accent); width: 35px; }

        /* --- RESPONSIVE BREAKPOINTS --- */
        
        /* 1. Layar Tablet (max-width: 992px) */
        @media (min-width: 769px) and (max-width: 992px) {
            .sidebar {
                width: 80px;
                left: 10px;
                padding: 25px 5px;
                align-items: center;
            }
            .sidebar h4, .menu-link span, .profile-section { display: none !important; }
            .img-menu-icon { margin-right: 0; width: 24px; height: 24px; }
            .main-content { margin-left: 110px; padding: 30px 20px; }
        }

        /* 2. Layar HP / Mobile (max-width: 768px) -> BERUBAH MENJADI BOTTOM NAV BAR */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                top: auto;
                left: 0;
                width: 100%;
                height: auto;
                padding: 10px 15px;
                background-color: rgba(24, 26, 61, 0.95);
                backdrop-filter: blur(10px);
                border-radius: 25px 25px 0 0;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-bottom: none;
                flex-direction: row;
                justify-content: space-around;
                z-index: 1050;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            }

            .sidebar h4, .profile-section { display: none !important; }

            .sidebar nav {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin: 0;
            }

            .menu-link {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 6px 4px;
                margin-bottom: 0;
                border-radius: 12px;
                flex: 1;
                font-size: 10px;
                text-align: center;
            }

            .img-menu-icon {
                margin-right: 0;
                margin-bottom: 4px;
                width: 22px;
                height: 22px;
            }

            .menu-link.active {
                background-color: transparent;
                color: var(--accent) !important;
            }

            .main-content {
                margin-left: 0;
                padding: 20px 15px 100px 15px; /* Spasi bawah agar tidak tertutup nav bar mobile */
            }

            /* Optimasi susunan podium agar fleksibel di layar kecil HP */
            .podium-container {
                gap: 10px;
                margin: 30px 0 40px 0;
                min-height: auto;
                align-items: flex-end;
            }
            .winner-name { font-size: 0.85rem; }
            .winner-xp { font-size: 0.75rem; margin-bottom: 8px; }
            .podium-step { font-size: 1.8rem; border-radius: 15px 15px 0 0; }
            .step-1 { height: 140px; }
            .step-2 { height: 105px; }
            .step-3 { height: 85px; }
            .podium-item:nth-child(2) .medal-graphic { max-width: 100px; }
            .medal-graphic { max-width: 75px; }
        }

        html { zoom: 90%; }
    </style>
</head>
