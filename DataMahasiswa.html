<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB NEXT GEN 😎</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
/* DASAR */
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
    color: white;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
}

/* SIDEBAR */
 .sidebar {
            background-color: #1b263b; height: 85vh; padding: 25px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column;
            position: fixed; width: 260px; top: 7.5vh; left: 20px; border-radius: 30px;
            z-index: 1000; overflow-y: auto; overflow-x: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: 0.4s ease;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(76, 201, 240, 0.3); border-radius: 10px; }

        .menu-link {
            display: flex; align-items: center; color: #adb5bd; text-decoration: none;
            padding: 12px 15px; border-radius: 15px; margin-bottom: 8px;
            transition: 0.3s; font-size: 0.85rem;
        }

         /* EFEK HOVER NYA */
        .menu-link:hover, .menu-link.active {
            background:linear-gradient(90deg,#4cc9f0,#4361ee);
            border:none; border-radius:20px; padding:12px;
            color:white; font-weight:600; transition:0.3s;; color: #0d1b2a !important; font-weight: 600;
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);}

        .img-menu-icon { width: 22px; margin-right: 12px; transition: 0.3s; }
        .menu-link.active .img-menu-icon { filter: brightness(0); } 
        .profile-section {
            margin-top: auto; background: rgba(255, 255, 255, 0.07);
            padding: 15px; border-radius: 20px; display: flex; align-items: center;}

/* MAIN */
.main-wrapper {
    margin-left: 300px;
    padding: 40px;
    width: calc(100% - 300px);
    transition: 0.4s ease;
}

/* KOTAK KANAN */
.glass-container {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(76, 201, 240, 0.2);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

/* DESAIN INPUT */
        .pill-input {border-radius: 50px; background: rgba(255, 255, 255, 0.08) !important;
                    border: 1px solid rgba(76, 201, 240, 0.4) !important;
                    color: white !important; padding: 10px 25px;
                    outline: none;}

        .pill-input:focus {border-color: #4cc9f0 !important;
                           background: rgba(255, 255, 225, 0.1) !important;
                           box-shadow: 0 0 10px rgba(76, 201, 240, 0.3) !important;
                           outline: none; color: white !important;}

        .pill-input option {background: #0d1b2a; color: white;}
        .pill-input::placeholder {color: white !important; opacity: 0.8; font-size: 0.85rem;}

/* TABEL */
        .table-custom {width: 100%; border-collapse: separate; border-spacing: 0 15px;}
        .table-custom thead th {color: #4cc9f0; border: none; padding: 15px; font-size: 0.85rem;}
        .table-custom tbody tr {background: rgba(255, 255, 255, 0.02); transition: 0.4s ease;}
        .table-custom tbody td {padding: 18px 15px; border: none; vertical-align: middle; font-weight: 500;}
        .table-custom tbody tr td:first-child {border-top-left-radius: 15px; border-bottom-left-radius: 15px;}
        .table-custom tbody tr td:last-child {border-top-right-radius: 15px; border-bottom-right-radius: 15px;}
        .table-custom tbody tr:hover {background: linear-gradient(90deg, rgba(76, 201, 240, 0.15), rgba(114, 9, 183, 0.15)); transform: translateX(8px);}

/* BUTTON */
        .btn-edit { background: #ffd700 !important; border: 1px solid rgba(255, 215, 0, 0.3) !important; border-radius: 12px; padding: 6px 15px; font-size: 0.75rem; transition: 0.3s; font-weight: 700}
        .btn-simpan { background: #4cc9f0 !important; border: 1px solid rgb(76, 201, 240) !important; border-radius: 12px; padding: 6px 15px; font-size: 0.75rem; transition: 0.3s; font-weight: 700}

/* STAT CARD */
.stat-card { border-radius: 20px; padding: 20px; transition: 0.3s; }
.stat-blue { background: rgba(76, 201, 240, 0.05); border-left: 5px solid #4cc9f0; }
.stat-green { background: rgba(46, 204, 113, 0.05); border-left: 5px solid #2ecc71; }
.stat-purple { background: rgba(155, 89, 182, 0.05); border-left: 5px solid #9b59b2; }

/* SCROLLBAR */
::-webkit-scrollbar {width: 6px;}
::-webkit-scrollbar-track {background: rgba(13, 27, 42, 0.98);}
::-webkit-scrollbar-thumb {background: linear-gradient(180deg, #4cc9f0, #4361ee); border-radius: 10px;}



@media (max-width: 992px) {
    .sidebar {
        left: -300px; 
        height: auto;
        position: relative;
        width: 100%;
        top: 0;
        margin-bottom: 20px;
        left: 0;
        border-radius: 20px;
    }

    .main-wrapper {
        margin-left: 0;
        width: 100%;
        padding: 20px;
    }

    .scroll-wrapper {
        overflow-x: auto; /* Biar tabel bisa di-geser kalau kepanjangan */
    }

    .table-custom {
        min-width: 600px; /* Minimal lebar tabel biar ga tumpang tindih */
    }

    .col-md-7.text-end {
        text-align: left !important;
        margin-top: 15px;
    }
    
    .pill-input.w-75 {
        width: 100% !important;
    }
}
</style>
</head>

<body>

    <div class="sidebar">
        <h4 class="fw-bold mb-5 text-center mt-2">UPK<span style="color: #4cc9f0;">SAINTEK</span></h4>
        <nav>
            <a href="DashboardDosen.html" class="menu-link">
                <img src="dashboard (1).png" class="img-menu-icon"> Dashboard
            </a>
            <a href="DataMahasiswa.html" class="menu-link active">
                <img src="data mahasiswa.png" class="img-menu-icon"> Data Mahasiswa
            </a>
            <a href="DataNilai.html" class="menu-link">
                <img src="data nilai.png" class="img-menu-icon"> Data Nilai
            </a>
            <a href="Login.html" class="menu-link mt-4" style="color: #ff4d4d;">
                <img src="log-out.png" class="img-menu-icon"> Keluar
            </a>
        </nav>

        <div class="profile-section mt-4">
            <img src="reading-book.png" class="rounded-circle me-2" width="35">
            <div class="overflow-hidden">
                <p class="small fw-bold mb-0 text-white" id="sidebarNama">Dosen ABC</p>
                <p class="mb-0 text-white opacity-50" style="font-size: 9px;">ID: 123456789</p>
            </div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card stat-blue">
                    <p class="small mb-1 text-light">Total Database</p>
                    <h4 class="fw-bold m-0 text-primary">1.254 <small style="font-size: 12px;" class="text-primary">Mahasiswa</small></h4>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card stat-green">
                    <p class="text-white small mb-1">Status Keaktifan</p>
                    <h4 class="fw-bold m-0 text-primary">98.2% <small style="font-size: 12px;" class="text-primary">Aktif</small></h4>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card stat-purple">
                    <p class="text-white small mb-1">Prodi Terbanyak</p>
                    <h4 class="fw-bold m-0" style="color: #4cc9f0;" id="statProdi">PTI</h4>
                </div>
            </div>
        </div>

        <div class="glass-container mt-5">
            <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
                <h2 class="fw-bold m-0">Data Siswa <span style="color: #4cc9f0;" id="judulProdi">Per Kelas</span></h2>
                <button class="btn-export-all btn btn-success rounded-pill">
                    Export Excel
                </button>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3 col-6">
                    <label class="small text-white mb-2 d-block">Pilih Kelas</label>
                    <select class="form-select pill-input" id="filterKelas">
                        <option>-- Pilih Kelas --</option>
                    </select>
                </div>
                <div class="col-md-2 col-6">
                    <label class="small text-white mb-2 d-block">Tampilkan</label>
                    <select class="form-select pill-input">
                        <option>10</option>
                        <option>20</option>
                    </select>
                </div>
                <div class="col-md-7 text-end align-self-end">
                    <input type="text" class="form-control pill-input w-75 d-inline-block" placeholder="Cari nama...">
                </div>
            </div>

            <div class="scroll-wrapper">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Siswa</th>
                            <th>Email</th>
                            <th>Kelas</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td class="fw-bold">Dita Damayanti <span class="badge bg-success" style="font-size: 10px;">Online</span></td>
                            <td>Dita123@gmail.com</td>
                            <td>Kelas 01</td>
                            <td class="text-center">
                                <button class="btn-edit" data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
                                <button class="btn-simpan" data-bs-toggle="modal" data-bs-target="#noteModal">Note</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.onload = function() {
            const namaDosen = localStorage.getItem("userName") || "Dosen ABC";
            const prodiPilihan = localStorage.getItem("selectedFocus") || "TI";
            document.getElementById("sidebarNama").innerText = namaDosen;
            document.getElementById("statProdi").innerText = prodiPilihan;
            document.getElementById("judulProdi").innerText = "Prodi " + prodiPilihan;

            const select = document.getElementById("filterKelas");
            if(prodiPilihan === "TI") select.innerHTML = '<option>Kelas 01 (TI)</option>';
            else if(prodiPilihan === "PTI") select.innerHTML = '<option>Kelas 01 (PTI)</option>';
            else select.innerHTML = '<option>Kelas 01 (Ilkom)</option>';
        }
    </script>
</body>
</html>
