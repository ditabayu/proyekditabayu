<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB NEXT GEN - Dashboard Dosen 📊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
            color: white; 
            min-height: 100vh; 
            margin: 0;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* --- SIDEBAR UTAMA (DESKTOP) --- */
        .sidebar {
            background-color: #1b263b; 
            height: 85vh; 
            padding: 25px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; 
            flex-direction: column;
            position: fixed; 
            width: 260px; 
            top: 7.5vh; 
            left: 20px; 
            border-radius: 30px;
            z-index: 1000; 
            overflow-y: auto; 
            overflow-x: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(76, 201, 240, 0.3); border-radius: 10px; }

        .menu-link {
            display: flex; 
            align-items: center; 
            color: #adb5bd; 
            text-decoration: none;
            padding: 12px 15px; 
            border-radius: 15px; 
            margin-bottom: 8px;
            transition: 0.3s; 
            font-size: 0.85rem;
        }

        .menu-link:hover, .menu-link.active {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            color: #0d1b2a !important; 
            font-weight: 600;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
        }

        .img-menu-icon { width: 22px; margin-right: 12px; transition: 0.3s; }
        .menu-link.active .img-menu-icon { filter: brightness(0); } 
        
        .profile-section {
            margin-top: auto; 
            background: rgba(255, 255, 255, 0.07);
            padding: 15px; 
            border-radius: 20px; 
            display: flex; 
            align-items: center;
        }

        /* --- CONTENT AREA (DESKTOP) --- */
        .content-area { 
            margin-left: 300px; 
            padding: 50px 40px; 
            width: calc(100% - 300px);
        }

        /* --- MENU BAWAH / BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(27, 38, 59, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 2000;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -5px 25px rgba(0,0,0,0.3);
            display: none; 
        }

        .bottom-nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            text-decoration: none;
            font-size: 0.62rem;
            width: 12.5%;
            height: 100%;
            transition: 0.2s;
            text-align: center;
        }

        .bottom-nav-link img {
            width: 18px;
            height: 18px;
            margin-bottom: 4px;
            opacity: 0.6;
        }

        .bottom-nav-link span {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .bottom-nav-link.active {
            color: #4cc9f0;
            font-weight: 600;
        }

        .bottom-nav-link.active img {
            opacity: 1;
            filter: drop-shadow(0 0 5px rgba(76, 201, 240, 0.6));
        }

        /* ==========================================================================
           RESPONSIVE ENGINE
           ========================================================================== */
        @media (max-width: 991.98px) {
            .sidebar {
                display: none !important;
            }
            .bottom-nav {
                display: flex;
            }
            .content-area {
                margin-left: 0 !important;
                width: 100% !important;
                padding: 20px 15px 95px 15px !important;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="sidebar">
            <h4 class="fw-bold mb-5 text-center mt-2">UPK<span style="color: #4cc9f0;">SAINTEK</span></h4>
            <nav>
                <a href="DashboardDosen.html" class="menu-link active">
                    <img src="dashboard (1).png" class="img-menu-icon" alt="icon"> Dashboard
                </a>
                <a href="DataMahasiswa.html" class="menu-link">
                    <img src="data mahasiswa.png" class="img-menu-icon" alt="icon"> Data Mahasiswa
                </a>
                <a href="DataNilai.html" class="menu-link">
                    <img src="data nilai.png" class="img-menu-icon" alt="icon"> Data Nilai
                </a>
                <a href="DataKelas.html" class="menu-link">
                    <img src="data kelas (2).png" class="img-menu-icon" alt="icon"> Data Kelas
                </a>
                <a href="DataMataKuliah.html" class="menu-link">
                    <img src="mata kuliah (2).png" class="img-menu-icon" alt="icon"> Data Mata Kuliah
                </a>
                <a href="DataTopik.html" class="menu-link">
                    <img src="data topik.png" class="img-menu-icon" alt="icon"> Data Topik
                </a>
                <a href="DataSoal.html" class="menu-link">
                    <img src="bank.png" class="img-menu-icon" alt="icon"> Data Soal
                </a>
                <a href="DataEvaluasi.html" class="menu-link">
                    <img src="evaluation.png" class="img-menu-icon" alt="icon"> Data Evaluasi
                </a>
            </nav>

            <div class="profile-section mt-4">
                <img src="reading-book.png" class="rounded-circle me-2" width="35" alt="profile">
                <div class="overflow-hidden">
                    <p class="small fw-bold mb-0 text-white">Dosen ABC</p>
                    <p class="mb-0 text-white opacity-50" style="font-size: 9px;">ID: 123456789</p>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div>
                <h2 class="fw-bold m-0">Dashboard<span style="color: #4cc9f0;"> Dosen</span></h2>
                <p class="small opacity-75 m-0 text-primary">Selamat datang di panel utama dosen.</p>
            </div>
            
            </div>
    </div>

    <div class="bottom-nav">
        <a href="DashboardDosen.html" class="bottom-nav-link active"><img src="dashboard (1).png" alt="icon"><span>Dashboard</span></a>
        <a href="DataMahasiswa.html" class="bottom-nav-link"><img src="data mahasiswa.png" alt="icon"><span>Mahasiswa</span></a>
        <a href="DataNilai.html" class="bottom-nav-link"><img src="data nilai.png" alt="icon"><span>Nilai</span></a>
        <a href="DataKelas.html" class="bottom-nav-link"><img src="data kelas (2).png" alt="icon"><span>Kelas</span></a>
        <a href="DataMataKuliah.html" class="bottom-nav-link"><img src="mata kuliah (2).png" alt="icon"><span>Matkul</span></a>
        <a href="DataTopik.html" class="bottom-nav-link"><img src="data topik.png" alt="icon"><span>Topik</span></a>
        <a href="DataSoal.html" class="bottom-nav-link"><img src="bank.png" alt="icon"><span>Soal</span></a>
        <a href="DataEvaluasi.html" class="bottom-nav-link"><img src="evaluation.png" alt="icon"><span>Evaluasi</span></a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
